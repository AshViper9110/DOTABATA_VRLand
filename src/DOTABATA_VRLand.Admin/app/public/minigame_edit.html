<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミニゲーム編集</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row label {
            margin-bottom: 0;
        }

        .button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #545b62;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>ミニゲーム編集</h1>

    <div class="card">

        <div class="form-group">
            <label for="name">ミニゲーム名</label>
            <input type="text" id="name" placeholder="ミニゲーム名を入力">
        </div>

        <div class="form-group">
            <label for="rule">ルール説明</label>
            <textarea id="rule" placeholder="ルールを入力（任意）"></textarea>
        </div>

        <div class="form-group">
            <label for="type">タイプ</label>
            <select id="type">
                <option value="1">スコア型</option>
                <option value="2">タイム型</option>
            </select>
        </div>

        <div class="form-group">
            <label for="sceneName">シーン名</label>
            <input type="text" id="sceneName" placeholder="シーン名を入力（例: MiniGame_01）">
        </div>

        <div class="form-group">
            <label>現在のアイコン</label>
            <img id="currentIcon" src="" alt="現在のアイコン" style="max-width: 150px; display: none; margin-bottom: 10px;">
        </div>

        <div class="form-group">
            <label for="icon">アイコン画像を変更（未選択なら現在の画像を維持）</label>
            <input type="file" id="icon" accept="image/*">
        </div>

        <div class="form-group checkbox-row">
            <input type="checkbox" id="playable">
            <label for="playable">プレイ可能にする</label>
        </div>

        <div class="button-area">
            <button class="save-btn" id="saveButton">
                保存
            </button>

            <button class="back-btn" id="backButton">
                戻る
            </button>
        </div>

    </div>

</div>

<script src="./js/minigame_edit.js"></script>
<script src="./js/auth-check.js"></script>
</body>
</html>
