<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>権限変更</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .current-info {
            margin-bottom: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #545b62;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>権限変更</h1>

    <div class="card">

        <div class="current-info">
            対象ユーザー: <span id="targetName"></span>（現在のレベル: <span id="currentLevel"></span>）
        </div>

        <div class="form-group">
            <label for="newLevel">新しい権限レベル</label>
            <select id="newLevel">
                <option value="0">0（自分の情報のみ編集可）</option>
                <option value="1">1（他の管理ユーザーの編集可）</option>
                <option value="2">2（権限変更・全操作可）</option>
            </select>
        </div>

        <div class="button-area">
            <button class="save-btn" id="saveButton">
                変更
            </button>

            <button class="back-btn" onclick="history.back()">
                戻る
            </button>
        </div>

    </div>

</div>

<script src="./js/adminUser_permissionEdit.js"></script>
<script src="./js/auth-check.js"></script>
</body>
</html>
