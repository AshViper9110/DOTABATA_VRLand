<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理システムログイン</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f6f8;
      font-family: "Yu Gothic", sans-serif;
    }

    .login-container {
      width: 400px;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #4a90e2;
    }

    button {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #357abd;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>管理システム</h1>

  <div class="form-group">
    <label>ユーザー名</label>
    <input type="text" id="username">
  </div>

  <div class="form-group">
    <label>パスワード</label>
    <input type="password" id="password">
  </div>

  <button onclick="login()">
    ログイン
  </button>
</div>

<script>
  async function login() {
    const username =
            document.getElementById("username").value;

    const password =
            document.getElementById("password").value;

    const res = await fetch("/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password
      })
    });

    if (res.ok) {
      location.href = "/main.html";
    } else {
      alert("ログイン失敗");
    }
  }
</script>

</body>
</html>
