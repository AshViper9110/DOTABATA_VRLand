<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理ユーザー登録</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .button-area {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>管理ユーザー登録</h1>

    <form id="registerForm">
        <div class="form-group">
            <label for="userName">名前</label>
            <input type="text" id="userName" required>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" required>
        </div>

        <div class="button-area">
            <button type="submit">作成</button>
        </div>
    </form>

    <a href="/adminUsers.html" class="home-link">
        ホームへ戻る
    </a>
    <div id="message"></div>

</div>
<script src="/js/adminUser_create.js"></script>
</body>
</html>
