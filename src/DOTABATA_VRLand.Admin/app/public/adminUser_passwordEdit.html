<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        .back-btn:hover {
            background: #545b62;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>パスワード変更</h1>

    <div class="card">

        <div class="form-group">
            <label for="currentPassword">現在のパスワード</label>
            <input
                    type="password"
                    id="currentPassword"
                    placeholder="現在のパスワードを入力">
        </div>

        <div class="form-group">
            <label for="newPassword">新しいパスワード</label>
            <input
                    type="password"
                    id="newPassword"
                    placeholder="新しいパスワードを入力">
        </div>

        <div class="form-group">
            <label for="confirmPassword">新しいパスワード（再入力）</label>
            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="もう一度入力してください">
        </div>

        <div class="button-area">
            <button class="save-btn" id="saveButton">
                変更
            </button>

            <button class="back-btn" onclick="history.back()">
                戻る
            </button>
        </div>

    </div>

</div>

<script src="./js/adminUser_passwordEdit.js"></script>
<script src="./js/auth-check.js"></script>
</body>
</html>
