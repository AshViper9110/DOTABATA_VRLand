<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー名変更</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .current-name {
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>ユーザー名変更</h1>

    <div class="card">

        <div class="form-group">
            <label>現在のユーザー名</label>
            <div class="current-name" id="currentName"></div>
        </div>

        <div class="form-group">
            <label for="newName">新しいユーザー名</label>
            <input type="text" id="newName">
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password">
        </div>

        <div class="button-area">
            <button class="save-btn" id="saveButton">変更</button>
            <button class="back-btn" onclick="history.back()">戻る</button>
        </div>

    </div>

</div>

<script src="./js/adminUser_nameEdit.js"></script>

</body>
</html>
