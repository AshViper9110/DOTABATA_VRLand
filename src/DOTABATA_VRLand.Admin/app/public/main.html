<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理システム</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      width: 800px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    .card h2 {
      margin-top: 0;
    }

    .card button {
      padding: 10px 20px;
      cursor: pointer;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>管理システム</h1>
      <button class="logout-btn" onclick="logout()">
        ログアウト
      </button>
  </div>

  <div class="menu">
    <div class="card">
      <h2>ユーザー管理</h2>
      <p>プレイヤー情報の確認・編集</p>
      <button onclick="location.href='/users.html'">
        ユーザー管理へ
      </button>
    </div>

    <div class="card">
      <h2>管理ユーザー管理</h2>
      <p>管理者アカウントの確認・編集</p>
      <button onclick="location.href='/adminUsers.html'">
        管理ユーザー管理へ
      </button>
    </div>

    <div class="card">
      <h2>ミニゲーム管理</h2>
      <p>ミニゲーム情報の確認・編集</p>
      <button onclick="location.href='/minigames'">
        ミニゲーム管理へ
      </button>
    </div>
  </div>
</div>
<script src="./js/main.js"></script>
</body>
</html>
