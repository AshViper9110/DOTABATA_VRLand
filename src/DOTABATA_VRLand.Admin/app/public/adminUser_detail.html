<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ユーザー詳細</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f6f9;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .row {
            display: flex;
            margin-bottom: 18px;
            align-items: center;
        }

        .label {
            width: 180px;
            font-weight: bold;
        }

        .value {
            flex: 1;
        }

        .button-area {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn {
            background: #007bff;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>管理ユーザー詳細</h1>

    <div class="card">

        <div class="row">
            <div class="label">ID</div>
            <div class="value" id="id"></div>
        </div>

        <div class="row">
            <div class="label">ユーザー名</div>
            <div class="value" id="name"></div>
        </div>

        <div class="row">
            <div class="label">パスワード</div>
            <div class="value" id="password">********</div>
        </div>

        <div class="row">
            <div class="label">作成日時</div>
            <div class="value" id="createdAt"></div>
        </div>

        <div class="row">
            <div class="label">更新日時</div>
            <div class="value" id="updatedAt"></div>
        </div>

        <div class="button-area">
            <button class="edit-btn" id="editNameButton">
                ユーザー名編集
            </button>

            <button class="edit-btn" id="editPasswordButton">
                パスワード編集
            </button>

            <button class="edit-btn" id="editPermissionButton">
                権限変更
            </button>

            <button class="delete-btn" id="deleteButton">
                削除
            </button>

            <button class="back-btn" onclick="history.back()">
                戻る
            </button>
        </div>

    </div>

</div>

<script src="./js/adminUser_detail.js"></script>
<script src="./js/auth-check.js"></script>
</body>
</html>
